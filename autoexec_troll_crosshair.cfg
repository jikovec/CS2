// troll-crosshair by 1EF - "Troll Crosshair" Config for CS2
// ---------------------------------------------------------
// [USAGE] Open the console and enter: "exec autoexec_troll_crosshair"
// ---------------------------------------------------------
// This config sets up a huuuge, exaggerated crosshair.
// It uses an atypical crosshair style and oversized values to create an unusable crosshair.
// Note: This is intended for trolling or experimentation, not for competitive play.
// ---------------------------------------------------------
cl_crosshairstyle "9"                       // New Static Quadrant style (September 2026)
cl_crosshair_screen_height "1080"           // Reference height for resolution-independent pixels
cl_crosshair_length "255"                  // Maximum supported arm length
cl_crosshair_thickness "32"                // Maximum supported thickness
cl_crosshair_gap "0"                       // Minimum static-quadrant gap
cl_crosshair_dynamic_maxdist_splitratio "1" // Maximum quadrant size
cl_crosshair_recoil "0"                    // Keep the exaggerated shape fixed
cl_crosshaircolor_r "255"                  // Preserve magenta / pink theme
cl_crosshaircolor_g "50"
cl_crosshaircolor_b "255"
cl_crosshaircolor_a "255"                  // Fully opaque
cl_crosshair_drawoutline "1"               // Full outline
cl_crosshairoutline_r "0"                  // Black outline
cl_crosshairoutline_g "0"
cl_crosshairoutline_b "0"
cl_crosshairoutline_a "255"
cl_crosshairdot "0"                        // No center dot
cl_crosshair_t "0"                         // Full quadrants
cl_ironsight_dot_scale "1"                 // Default scope dot size
cl_ironsight_usecrosshaircolor "0"         // Default scope dot color

hud_showtargetid "0"                 // Disable target identification on the HUD

echo "Troll crosshair loaded!"